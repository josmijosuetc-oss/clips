[build]
  publish = "public"

# Backend desplegado en Render.
[[redirects]]
  from = "/api/*"
  to = "https://clipwise-jvci.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "https://clipwise-jvci.onrender.com/media/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/preview/*"
  to = "https://clipwise-jvci.onrender.com/preview/:splat"
  status = 200
  force = true
